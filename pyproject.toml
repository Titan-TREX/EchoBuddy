[project]
name = "voice-chatbot-system"
version = "0.1.0"
description = "A fault-tolerant, low-latency voice chatbot built on Temporal.io"
readme = "README copy.md"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Ali" }
]
dependencies = [
    "temporalio==1.28.0",
    "streamlit==1.58.0",
    "deepgram-sdk==7.3.1",
    "google-genai==2.8.0",
    "cartesia==3.2.0",
    "aiosqlite==0.22.1",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "groq>=1.4.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "webrtcvad-wheels>=2.0.14",
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.49.0",
    "openai>=3.36.1",
    "langfuse>=5.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
package = false
